# Rust Axum blog (xore//blog frontend embedded via include_str!) —
# static musl binary in a small Alpine image
# Dockge: place Cargo.toml, src/main.rs, the static/ folder, Dockerfile and
# .dockerignore in the stack folder (e.g. /opt/stacks/rust-api/)
#
# Built from the Dockerfile (multi-stage: rust builder → alpine).
# First build takes a few minutes (compiles axum/tokio); rebuilds are
# fast thanks to the dependency-caching layer.

services:
  rust-api:
    build: .
    image: rust-blog-api:local
    container_name: rust-api
    restart: unless-stopped
    ports:
      - 127.0.0.1:5004:5004
    volumes:
      # posts.json lives in a volume, not the repo
      - blog-data:/data
    environment:
      - PORT=5004
      - ADMIN_PASSWORD=change-me-rs
      - DATA_FILE=/data/posts.json
      - TZ=Europe/Berlin
    # Healthcheck is baked into the Dockerfile (busybox wget on /health)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  socat-rust-api:
    image: alpine/socat:latest
    container_name: socat-rust-api
    restart: unless-stopped
    command: TCP4-LISTEN:5004,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:5004
    network_mode: host
    depends_on:
      rust-api:
        condition: service_healthy

volumes:
  blog-data:
