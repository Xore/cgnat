# vui-blog-auth — the vui-blog example with a login wall in front of it.
#
# Topology (home server):
#   socat (10.8.0.2:3000) → auth-gateway (:8080) → vui-blog (:3000, internal only)
#
# The blog container is NOT published to the host. The only way in is through
# the auth-gateway, which serves a login page and reverse-proxies to the blog
# once you hold a valid session cookie.
#
# Two independent layers of auth:
#   1. auth-gateway  — gates the WHOLE site (read + write) behind a login
#   2. blog admin    — the blog's own X-Admin-Token, still required to edit posts
#
# Dockge: place this whole folder (including auth-gateway/) in the stack dir,
# e.g. /opt/stacks/vui-blog-auth/

services:
  vui-blog:
    image: node:22-alpine
    container_name: vui-blog-auth-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Whole project: Vite builds dist/ and Express serves it + the API.
      - ./:/app
      # node_modules as a named volume so native binaries build for alpine (musl).
      - node-modules:/app/node_modules
      # posts.json lives in a volume, not the repo.
      - posts-data:/app/data
    # Use a list form so each argument is passed directly — no shell quoting issues
    command:
      - sh
      - -c
      - "npm install --include=dev && npm run build && node app.js"
    # No host port publish — only the auth-gateway (same network) can reach it.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Berlin
      - ADMIN_PASSWORD=change-me-vui
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s   # first start runs npm install + vite build
    networks:
      - blog-internal

  auth-gateway:
    build: ./auth-gateway
    image: xore-auth-gateway:local
    container_name: vui-blog-auth-gateway
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:8080
    environment:
      - LISTEN_ADDR=:8080
      - UPSTREAM=http://vui-blog:3000
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=change-me-gate
      # Set a long random string so sessions survive restarts and match across
      # replicas. Generate one with:  openssl rand -hex 32
      - COOKIE_SECRET=CHANGE_ME_generate_with_openssl_rand_hex_32
      - SESSION_TTL_HOURS=12
      # Cookie is marked Secure because the browser reaches us over HTTPS
      # (Cloudflare → Traefik). Set to "false" only for plain-HTTP local testing.
      - COOKIE_SECURE=true
      - TZ=Europe/Berlin
    depends_on:
      vui-blog:
        condition: service_healthy
    networks:
      - blog-internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M

  socat-vui-blog-auth:
    image: alpine/socat:latest
    container_name: socat-vui-blog-auth
    restart: unless-stopped
    command: TCP4-LISTEN:3000,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:3000
    network_mode: host
    depends_on:
      auth-gateway:
        condition: service_healthy

networks:
  blog-internal:
    driver: bridge

volumes:
  node-modules:
  posts-data:
