<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xore//blog</title>
  <link rel="stylesheet" href="xore.css" />
  <script>window.BLOG = { stack: "C# · ASP.NET + POSTGRES" };</script>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__glow scene__glow--warm"></div>
    <div class="scene__glow scene__glow--cool"></div>
    <div class="scene__grid"></div>
    <div class="scene__vignette"></div>
  </div>

  <header class="site-header">
    <div class="meta">
      <div class="container meta__inner">
        <span class="status"><span class="status__led"></span> BLOG ONLINE</span>
        <span class="status" id="stack-tag" style="color: var(--cyan)"></span>
      </div>
    </div>
    <div class="container nav">
      <a class="brand" href="#/" aria-label="xore blog home">
        <svg class="brand__mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <path d="M6 6l20 20M26 6L6 26" stroke="url(#bg)" stroke-width="3.4" stroke-linecap="round" />
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#38bdf8" /><stop offset="1" stop-color="#34d399" />
          </linearGradient></defs>
        </svg>
        <span class="brand__text">XORE<span class="brand__slash">//</span>BLOG</span>
      </a>
      <div class="nav__right">
        <span class="admin-badge" id="admin-badge" hidden>ADMIN</span>
        <a class="nav-btn" id="nav-posts" href="#/">POSTS</a>
        <a class="nav-btn" id="nav-admin" href="#/admin">ADMIN</a>
      </div>
    </div>
  </header>

  <div class="marquee" aria-hidden="true">
    <div class="marquee__track" id="marquee-track"></div>
  </div>

  <main class="main">
    <div class="container">
      <div class="view" id="view-posts"></div>
      <div class="view" id="view-post"></div>
      <div class="view" id="view-admin"></div>
      <div class="view" id="view-form"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>xore//blog</span>
      <span class="footer__sep">◆</span>
      <span id="footer-stack">self-hosted</span>
      <span class="footer__sep">◆</span>
      <span>no cloud</span>
    </div>
  </footer>

  <div class="toast-wrap" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
