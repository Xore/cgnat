# ASP.NET Core 9 blog + PostgreSQL (xore//blog frontend + REST API)
# Dockge: place BlogApi.csproj, Program.cs, Dockerfile, .dockerignore and
# the wwwroot/ folder in the stack folder (e.g. /opt/stacks/csharp-api/)
#
# Built from the Dockerfile (multi-stage: SDK build → slim runtime).

services:
  postgres:
    image: postgres:17-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=blog
      - POSTGRES_USER=blog
      - POSTGRES_PASSWORD=changeme
      - TZ=Europe/Berlin
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  csharp-api:
    build: .
    image: csharp-blog-api:local
    container_name: csharp-api
    restart: unless-stopped
    ports:
      - 127.0.0.1:5002:5002
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=blog
      - POSTGRES_USER=blog
      - POSTGRES_PASSWORD=changeme
      - ADMIN_PASSWORD=change-me-cs
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Europe/Berlin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  socat-csharp-api:
    image: alpine/socat:latest
    container_name: socat-csharp-api
    restart: unless-stopped
    command: TCP4-LISTEN:5002,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:5002
    network_mode: host
    depends_on:
      csharp-api:
        condition: service_healthy

volumes:
  pg-data:
