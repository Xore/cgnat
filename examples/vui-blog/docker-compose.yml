services:
  vui-blog:
    image: node:22-alpine
    container_name: vui-blog
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Whole project: Vite builds dist/ and Express serves it + the API.
      - ./:/app
      # node_modules as a named volume so native binaries build for alpine (musl).
      - node-modules:/app/node_modules
      # posts.json lives in a volume, not the repo.
      - posts-data:/app/data
    # --include=dev installs Vite (a devDependency) even under NODE_ENV=production;
    # list form keeps the whole script as one argument to `sh -c`.
    command:
      - sh
      - -c
      - "npm install --include=dev && npm run build && node app.js"
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Europe/Berlin
      - ADMIN_PASSWORD=change-me-vui
    # No `user: node`: the named volumes are created root-owned, so uid 1000
    # could not npm install or write posts.json. Nothing lands on the host.

  socat-vui-blog:
    image: alpine/socat:latest
    container_name: socat-vui-blog
    restart: unless-stopped
    command: TCP4-LISTEN:3000,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:3000
    network_mode: host
    depends_on:
      - vui-blog

volumes:
  node-modules:
  posts-data:
