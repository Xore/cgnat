services:
  nginx-static:
    image: nginx:alpine
    container_name: nginx-static
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro        # your site files
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # custom nginx config
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  socat-static:
    image: alpine/socat:latest
    container_name: socat-static
    restart: unless-stopped
    # Listens on WireGuard IP, forwards to nginx on localhost
    command: TCP4-LISTEN:8080,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:8080
    network_mode: host
    depends_on:
      nginx-static:
        condition: service_healthy
