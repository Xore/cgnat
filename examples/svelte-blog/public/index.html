<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xore//svelte</title>
  <meta name="description" content="Self-hosted Svelte 5 blog — CGNAT, no cloud." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #06080b;
      --panel:   #0f141b;
      --panel-2: #12181f;
      --line:    rgba(255,255,255,0.07);
      --line-2:  rgba(255,255,255,0.11);
      --text:    #e8edf3;
      --muted:   #8a97a8;
      --faint:   #5c697a;
      /* Svelte brand: orange-red accent instead of cyan */
      --accent:  #ff3e00;
      --accent-2:#ff6d3a;
      --accent-glow: rgba(255,62,0,0.18);
      --green:   #34d399;
      --amber:   #fbbf24;
      --red:     #f87171;
      --radius:  14px;
      --ease:    cubic-bezier(0.22,1,0.36,1);
      --font:    "Inter", system-ui, sans-serif;
      --mono:    "JetBrains Mono", ui-monospace, monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{min-height:100vh;font-family:var(--font);color:var(--text);
      background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
    a{color:inherit;text-decoration:none;} svg{display:block;}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}

    /* scene */
    .scene{position:fixed;inset:0;z-index:-1;overflow:hidden;
      background:radial-gradient(120% 80% at 50% -10%,#1a1008 0%,#090c11 55%,#06080b 100%);}
    .scene__glow{position:absolute;border-radius:50%;filter:blur(130px);}
    .scene__glow--a{width:680px;height:680px;right:-200px;bottom:-160px;
      background:radial-gradient(circle,rgba(255,62,0,.18),transparent 70%);}
    .scene__glow--b{width:540px;height:540px;left:-160px;top:-120px;
      background:radial-gradient(circle,rgba(255,109,58,.10),transparent 70%);}
    .scene__grid{position:absolute;inset:0;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:60px 60px;
      mask-image:radial-gradient(ellipse 75% 60% at 50% 30%,#000 30%,transparent 78%);}
    .scene__vignette{position:absolute;inset:0;
      background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.65) 100%);}

    /* header */
    .site-header{position:sticky;top:0;z-index:40;background:rgba(6,8,11,.75);
      backdrop-filter:blur(18px);border-bottom:1px solid var(--line);}
    .meta-bar{border-bottom:1px solid var(--line);background:rgba(255,255,255,.013);}
    .meta-bar__inner{display:flex;align-items:center;justify-content:space-between;
      height:32px;max-width:1100px;margin-inline:auto;padding-inline:24px;}
    .status{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
      font-size:.68rem;letter-spacing:.08em;color:var(--accent-2);}
    .status__led{width:7px;height:7px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 10px var(--accent);animation:pulse 2s var(--ease) infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .svelte-tag{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
      background:rgba(255,62,0,.1);border:1px solid rgba(255,62,0,.25);
      color:var(--accent-2);padding:2px 9px;border-radius:6px;}
    .nav{display:flex;align-items:center;justify-content:space-between;height:60px;
      max-width:1100px;margin-inline:auto;padding-inline:24px;}
    .brand{display:inline-flex;align-items:center;gap:12px;cursor:pointer;}
    .brand__text{font-weight:800;letter-spacing:.12em;font-size:1.05rem;font-family:var(--mono);}
    .brand__slash{color:var(--accent);}
    .nav__right{display:flex;align-items:center;gap:20px;}
    .nav-btn{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;color:var(--muted);
      padding:4px 0;position:relative;transition:color .2s;}
    .nav-btn:hover,.nav-btn.active{color:var(--text);}
    .nav-btn::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;
      background:var(--accent);transition:right .28s var(--ease);}
    .nav-btn:hover::after,.nav-btn.active::after{right:0;}
    .auth-badge{font-family:var(--mono);font-size:.65rem;
      background:rgba(255,62,0,.1);border:1px solid rgba(255,62,0,.25);
      color:var(--accent-2);padding:3px 9px;border-radius:6px;letter-spacing:.07em;}

    /* marquee */
    .marquee{border-bottom:1px solid var(--line);background:rgba(255,255,255,.012);
      overflow:hidden;padding:10px 0;}
    .marquee__track{display:inline-flex;align-items:center;gap:20px;white-space:nowrap;
      animation:marquee 36s linear infinite;will-change:transform;}
    .marquee__item{font-family:var(--mono);font-size:.74rem;letter-spacing:.14em;
      color:var(--muted);text-transform:uppercase;}
    .marquee__sep{color:var(--accent);font-size:.58rem;}
    @keyframes marquee{to{transform:translateX(-50%)}}

    /* main layout */
    .main{flex:1;padding:clamp(32px,6vw,72px) 0;}
    .container{width:100%;max-width:1100px;margin-inline:auto;padding-inline:24px;}
    .view{display:none;animation:fadeIn .2s var(--ease);}
    .view.active{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* page title */
    .page-title{font-family:var(--mono);font-size:clamp(1rem,2vw,1.35rem);
      font-weight:600;letter-spacing:.08em;color:var(--accent-2);margin-bottom:28px;
      display:flex;align-items:center;gap:10px;}
    .page-title::before{content:"$";color:var(--accent);font-weight:400;}

    /* Svelte badge pill */
    .fw-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);
      font-size:.72rem;letter-spacing:.06em;color:var(--muted);
      background:rgba(255,62,0,.07);border:1px solid rgba(255,62,0,.18);
      padding:5px 12px;border-radius:99px;margin-bottom:28px;}
    .fw-pill__dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
      box-shadow:0 0 8px var(--accent);}

    /* post grid */
    .post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:18px;}
    .post-card{background:linear-gradient(160deg,#0d1118 0%,#080b0f 100%);
      border:1px solid var(--line-2);border-radius:var(--radius);
      padding:22px 24px;cursor:pointer;
      transition:border-color .22s var(--ease),box-shadow .22s var(--ease),transform .18s var(--ease);}
    .post-card:hover{border-color:rgba(255,62,0,.3);
      box-shadow:0 0 28px -8px var(--accent-glow);transform:translateY(-2px);}
    .post-card__rune{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
      color:var(--accent);margin-bottom:10px;opacity:.7;}  
    .post-card__title{font-size:.98rem;font-weight:700;margin-bottom:8px;color:var(--text);line-height:1.3;}
    .post-card__meta{font-family:var(--mono);font-size:.7rem;color:var(--faint);
      letter-spacing:.05em;margin-bottom:10px;}
    .post-card__excerpt{font-size:.86rem;color:var(--muted);line-height:1.65;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
    .post-card__cta{margin-top:14px;color:var(--accent-2);font-family:var(--mono);
      font-size:.75rem;display:flex;align-items:center;gap:5px;
      transition:gap .2s var(--ease);opacity:.8;}
    .post-card:hover .post-card__cta{gap:9px;opacity:1;}

    /* single post */
    .post-single{max-width:76ch;}
    .post-single__back{font-family:var(--mono);font-size:.76rem;color:var(--muted);
      margin-bottom:24px;display:flex;align-items:center;gap:6px;transition:color .18s;}
    .post-single__back:hover{color:var(--accent-2);}
    .post-single__rune{font-family:var(--mono);font-size:.7rem;color:var(--accent);
      letter-spacing:.1em;margin-bottom:10px;opacity:.7;}
    .post-single__title{font-size:clamp(1.4rem,3vw,2.1rem);font-weight:700;
      line-height:1.18;margin-bottom:12px;}
    .post-single__meta{font-family:var(--mono);font-size:.73rem;color:var(--faint);
      letter-spacing:.05em;padding-bottom:24px;margin-bottom:24px;
      border-bottom:1px solid var(--line);}
    .post-single__body{font-size:.94rem;line-height:1.82;color:var(--muted);white-space:pre-wrap;}

    /* admin gate */
    .admin-gate{max-width:400px;margin:0 auto;
      background:linear-gradient(160deg,#0d1118,#080b0f);
      border:1px solid var(--line-2);border-radius:var(--radius);padding:32px;}
    .gate-title{font-family:var(--mono);font-size:.88rem;letter-spacing:.08em;
      color:var(--accent-2);margin-bottom:6px;text-align:center;}
    .gate-sub{font-family:var(--mono);font-size:.7rem;color:var(--faint);
      text-align:center;margin-bottom:24px;letter-spacing:.05em;}

    /* forms */
    .form-group{margin-bottom:14px;}
    .form-label{display:block;font-family:var(--mono);font-size:.69rem;
      letter-spacing:.1em;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
    .form-input,.form-textarea{
      width:100%;background:#06090d;border:1px solid rgba(255,255,255,.1);
      border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.84rem;
      padding:10px 13px;outline:none;transition:border-color .2s;}
    .form-input:focus,.form-textarea:focus{border-color:rgba(255,62,0,.4);}
    .form-textarea{resize:vertical;min-height:200px;font-size:.88rem;font-family:var(--font);}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:580px){.form-row{grid-template-columns:1fr;}}
    .form-check{display:flex;align-items:center;gap:9px;cursor:pointer;}
    .form-check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;}
    .form-check span{font-family:var(--mono);font-size:.76rem;color:var(--muted);}

    /* buttons */
    .btn{font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;
      padding:9px 18px;border-radius:8px;border:none;cursor:pointer;
      transition:all .2s var(--ease);}
    .btn-primary{background:rgba(255,62,0,.12);border:1px solid rgba(255,62,0,.3);color:var(--accent-2);}
    .btn-primary:hover{background:rgba(255,62,0,.22);border-color:var(--accent);}
    .btn-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.22);color:var(--red);}
    .btn-danger:hover{background:rgba(248,113,113,.16);}
    .btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--muted);}
    .btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.04);}

    /* admin table */
    .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
    .table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
    .table-wrap table{width:100%;border-collapse:collapse;}
    .table-wrap th{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
      color:var(--faint);text-transform:uppercase;padding:11px 15px;
      background:#0a0d12;border-bottom:1px solid var(--line);text-align:left;}
    .table-wrap td{padding:11px 15px;border-bottom:1px solid var(--line);
      font-size:.84rem;color:var(--muted);vertical-align:middle;}
    .table-wrap tr:last-child td{border-bottom:none;}
    .table-wrap tr:hover td{background:rgba(255,255,255,.012);}
    .table-wrap td:first-child{color:var(--text);font-weight:500;}
    .badge{font-family:var(--mono);font-size:.62rem;padding:3px 8px;
      border-radius:6px;letter-spacing:.06em;}
    .badge-pub{background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.22);color:var(--green);}
    .badge-draft{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--faint);}
    .row-actions{display:flex;gap:7px;}

    /* form panel */
    .form-panel{background:linear-gradient(160deg,#0d1118,#080b0f);
      border:1px solid var(--line-2);border-radius:var(--radius);padding:26px;}
    .form-panel__header{display:flex;justify-content:space-between;
      align-items:center;margin-bottom:22px;}

    /* toast */
    .toast-wrap{position:fixed;bottom:22px;right:22px;z-index:100;
      display:flex;flex-direction:column;gap:8px;pointer-events:none;}
    .toast{font-family:var(--mono);font-size:.76rem;letter-spacing:.04em;
      padding:11px 16px;border-radius:10px;border:1px solid;
      pointer-events:auto;animation:toastIn .28s var(--ease);}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .toast-ok{background:#0a1a0e;border-color:rgba(52,211,153,.3);color:var(--green);}
    .toast-err{background:#1a0806;border-color:rgba(248,113,113,.28);color:var(--red);}

    /* empty */
    .empty{display:flex;flex-direction:column;align-items:center;
      text-align:center;padding:72px 24px;color:var(--faint);}
    .empty svg{margin-bottom:16px;opacity:.3;}
    .empty h3{color:var(--muted);margin-bottom:8px;font-size:.92rem;}
    .empty p{font-family:var(--mono);font-size:.78rem;max-width:34ch;}

    /* footer */
    .footer{border-top:1px solid var(--line);padding:20px 0;}
    .footer__inner{display:flex;align-items:center;justify-content:center;
      gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;
      letter-spacing:.08em;color:var(--faint);text-transform:uppercase;}
    .footer__sep{color:var(--accent);font-size:.56rem;}

    @media(max-width:600px){.nav__right{gap:12px;}.auth-badge{display:none;}}
    @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
  </style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="scene__glow scene__glow--a"></div>
  <div class="scene__glow scene__glow--b"></div>
  <div class="scene__grid"></div>
  <div class="scene__vignette"></div>
</div>

<header class="site-header">
  <div class="meta-bar">
    <div class="meta-bar__inner">
      <span class="status"><span class="status__led"></span>SVELTE BLOG ONLINE</span>
      <span class="svelte-tag">SVELTE 5 RUNES</span>
    </div>
  </div>
  <nav class="nav">
    <button class="brand" onclick="nav('posts')" aria-label="xore svelte blog">
      <!-- Svelte flame logo (SVG) -->
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true" style="filter:drop-shadow(0 0 8px rgba(255,62,0,.5))">
        <path d="M53.6 13.2C49.2 5.4 39.2 2.4 31.4 7.2L15.6 16.8C11.8 19.2 9.2 23 8.4 27.2c-.6 3.4 0 6.8 1.8 9.8-1.4 2.2-2 4.8-1.8 7.4.4 4.8 3.4 9 8 11.2 4.4 2.2 9.6 2 13.8-.6l15.8-9.6c3.8-2.4 6.4-6.2 7.2-10.4.6-3.4 0-6.8-1.8-9.8 1.4-2.2 2-4.8 1.8-7.4-.4-4.8-3.4-9-8-11.2-.4-.2-.8-.4-1.2-.4h-.4z" fill="#FF3E00"/>
        <path d="M28.6 49.8c-3.8 1-7.8-.6-9.8-4-1.2-2-1.4-4.4-.8-6.6l.4-1.2 1 .8c2.4 1.6 5 2.6 7.8 3l.8.1-.1.8c-.1 1 .2 2 .9 2.8.9 1.2 2.4 1.8 3.8 1.4 1.8-.4 3-2 2.8-3.8l-.2-1.2 3.4-2-2.4-4-2.8 1.6-2.6-1.2.6-4.2-4.4-.6-.6 4.2-2.2 1.8-3.8-2.4-2.4 3.8 3.8 2.4-.2 2.8c-.2 3.6 2 7 5.4 8.2 3.4 1.2 7.2 0 9.4-3l.4-.6-1.2-.8c-2.4-1.4-4.2-3.4-5.2-5.8" fill="#FFF" opacity=".9"/>
      </svg>
      <span class="brand__text">XORE<span class="brand__slash">//</span>SVELTE</span>
    </button>
    <div class="nav__right">
      <button class="nav-btn" id="nb-posts" onclick="nav('posts')">POSTS</button>
      <button class="nav-btn" id="nb-admin" onclick="nav('admin-gate')">ADMIN</button>
      <span class="auth-badge" id="auth-badge" style="display:none">&#9679; AUTH</span>
    </div>
  </nav>
</header>

<div class="marquee" aria-hidden="true">
  <div class="marquee__track" id="mtrack"></div>
</div>

<main class="main">
  <div class="container">

    <!-- Posts list -->
    <div class="view active" id="view-posts">
      <div class="fw-pill">
        <span class="fw-pill__dot"></span>
        Svelte 5 &mdash; Runes-based reactivity &mdash; No virtual DOM
      </div>
      <h1 class="page-title">ls ./posts</h1>
      <div class="post-grid" id="postGrid"></div>
    </div>

    <!-- Single post -->
    <div class="view" id="view-post">
      <button class="post-single__back" onclick="nav('posts')">&#8592; cd ..</button>
      <article class="post-single">
        <div class="post-single__rune" id="sRune"></div>
        <h1 class="post-single__title" id="sTitle"></h1>
        <div class="post-single__meta" id="sMeta"></div>
        <div class="post-single__body" id="sBody"></div>
      </article>
    </div>

    <!-- Admin gate -->
    <div class="view" id="view-admin-gate">
      <div class="admin-gate">
        <div class="gate-title">// admin access</div>
        <div class="gate-sub">$state(authenticated) = false</div>
        <div class="form-group">
          <label class="form-label" for="tInput">Admin Token</label>
          <input class="form-input" id="tInput" type="password" placeholder="your-admin-secret" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="doLogin()">
          AUTHENTICATE &#8594;
        </button>
      </div>
    </div>

    <!-- Admin list -->
    <div class="view" id="view-admin">
      <div class="admin-header">
        <h1 class="page-title" style="margin-bottom:0">$derived(allPosts)</h1>
        <button class="btn btn-primary" onclick="nav('admin-new')">+ NEW POST</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Title</th><th>Slug</th><th>Status</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody id="adminTbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Admin form -->
    <div class="view" id="view-admin-form">
      <div class="form-panel">
        <div class="form-panel__header">
          <span class="page-title" style="margin-bottom:0" id="fmTitle">// new post</span>
          <button class="btn btn-ghost" onclick="nav('admin')">&#8592; cancel</button>
        </div>
        <input type="hidden" id="fmId" />
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input class="form-input" id="fmTitleIn" placeholder="Post title" />
          </div>
          <div class="form-group">
            <label class="form-label">Slug</label>
            <input class="form-input" id="fmSlugIn" placeholder="auto-generated" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Content *</label>
          <textarea class="form-textarea" id="fmContent" style="min-height:260px"
            placeholder="Write your post content here&hellip;"></textarea>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
          <label class="form-check">
            <input type="checkbox" id="fmPub" />
            <span>Published</span>
          </label>
          <button class="btn btn-primary" onclick="doSave()">SAVE POST &#8594;</button>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="container footer__inner">
    <span>xore//svelte</span>
    <span class="footer__sep">&#9670;</span>
    <span>svelte 5 runes</span>
    <span class="footer__sep">&#9670;</span>
    <span>self-hosted</span>
    <span class="footer__sep">&#9670;</span>
    <span>cgnat tunnel</span>
  </div>
</footer>

<div class="toast-wrap" id="toastWrap"></div>

<script>
(function(){
  "use strict";

  /* ---- Svelte 5 Runes emulation in vanilla JS ----
     In a real SvelteKit build you'd use $state(), $derived(), $effect().
     Here we replicate the same reactivity model manually so no build step
     is needed — the container runs node app.js directly.
  */

  // $state()
  let _token     = null;
  let _editingId = null;

  // marquee
  const mItems = ["SVELTE 5","RUNES","$STATE()","$DERIVED()","$EFFECT()","NO VDOM","SELF-HOSTED","CGNAT","HEINSBERG DE","ZERO CLOUD"];
  const mtrack = document.getElementById("mtrack");
  const mkRow  = (arr) => arr.map(t =>
    `<span class="marquee__item">${t}</span><span class="marquee__sep">&#9670;</span>`
  ).join("");
  mtrack.innerHTML = mkRow(mItems) + mkRow(mItems);

  // $effect() — routing
  function nav(view) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-" + view)?.classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    const isPost  = view === "posts" || view === "post";
    const isAdmin = view.startsWith("admin");
    if (isPost)  document.getElementById("nb-posts")?.classList.add("active");
    if (isAdmin) document.getElementById("nb-admin")?.classList.add("active");
    if (view === "posts")    loadPosts();
    if (view === "admin")    loadAdmin();
    if (view === "admin-new") openForm(null);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function toast(msg, type) {
    const w = document.getElementById("toastWrap");
    const el = document.createElement("div");
    el.className = "toast toast-" + (type||"ok");
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => el.remove(), 3400);
  }

  const fmt = ts => new Intl.DateTimeFormat("en-GB",{
    timeZone:"Europe/Berlin",year:"numeric",month:"short",day:"2-digit"
  }).format(new Date(ts));

  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // $derived() — API helper
  async function api(method, path, body) {
    const opts = { method, headers:{"Content-Type":"application/json"} };
    if (_token) opts.headers["X-Admin-Token"] = _token;
    if (body)   opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    if (!r.ok) { const e = await r.json().catch(()=>({error:"Request failed"})); throw new Error(e.error||r.statusText); }
    return r.status === 204 ? null : r.json();
  }

  // $effect() — load public posts
  async function loadPosts() {
    const g = document.getElementById("postGrid");
    g.innerHTML = `<div style="color:var(--faint);font-family:var(--mono);font-size:.8rem">$effect(fetchPosts)&hellip;</div>`;
    try {
      const posts = await api("GET","/api/posts");
      if (!posts.length) {
        g.innerHTML = `<div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 12h6M9 16h6M7 3H5a2 2 0 00-2 2v16a2 2 0 002 2h14a2 2 0 002-2V8l-5-5H7z"/>
          </svg>
          <h3>No posts yet</h3><p>Create your first post from the admin panel.</p>
        </div>`;
        return;
      }
      g.innerHTML = posts.map(p => `
        <div class="post-card" onclick="openPost('${esc(p.id)}')" role="button" tabindex="0">
          <div class="post-card__rune">$state.posts[${esc(p.id.slice(0,8))}]</div>
          <div class="post-card__title">${esc(p.title)}</div>
          <div class="post-card__meta">${fmt(p.createdAt)}</div>
          <div class="post-card__excerpt">${esc(p.content.slice(0,180))}</div>
          <div class="post-card__cta">READ MORE <span>&#8594;</span></div>
        </div>`).join("");
    } catch(e) {
      g.innerHTML = `<div class="empty"><h3>Failed to load</h3><p>${esc(e.message)}</p></div>`;
    }
  }

  // $derived(post)
  async function openPost(id) {
    try {
      const p = await api("GET","/api/posts/"+id);
      document.getElementById("sRune").textContent   = `$derived(post.${p.id.slice(0,8)})`;
      document.getElementById("sTitle").textContent  = p.title;
      document.getElementById("sMeta").innerHTML     =
        `<span style="color:var(--accent-2)">${fmt(p.createdAt)}</span>
         <span style="margin-left:14px;color:var(--faint)">/${p.slug}</span>`;
      document.getElementById("sBody").textContent   = p.content;
      nav("post");
    } catch(e) { toast("Load failed: "+e.message,"err"); }
  }

  // $effect() — admin auth
  function doLogin() {
    const t = document.getElementById("tInput").value.trim();
    if (!t) { toast("Enter your admin token","err"); return; }
    _token = t;
    document.getElementById("auth-badge").style.display = "inline-block";
    nav("admin");
  }

  // $derived(allPosts) — admin list
  async function loadAdmin() {
    if (!_token) { nav("admin-gate"); return; }
    const tb = document.getElementById("adminTbody");
    tb.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:22px;color:var(--faint);font-family:var(--mono);font-size:.78rem">$effect(fetchAll)&hellip;</td></tr>`;
    try {
      const posts = await api("GET","/api/admin/posts");
      if (!posts.length) {
        tb.innerHTML = `<tr><td colspan="5"><div class="empty" style="padding:36px"><h3>No posts yet</h3></div></td></tr>`;
        return;
      }
      tb.innerHTML = posts.map(p => `
        <tr>
          <td>${esc(p.title)}</td>
          <td style="font-family:var(--mono);font-size:.76rem">${esc(p.slug)}</td>
          <td><span class="badge ${p.published?"badge-pub":"badge-draft"}">${p.published?"LIVE":"DRAFT"}</span></td>
          <td style="font-family:var(--mono);font-size:.73rem">${fmt(p.createdAt)}</td>
          <td><div class="row-actions">
            <button class="btn btn-ghost" style="padding:4px 11px;font-size:.7rem" onclick="openForm('${esc(p.id)}')">EDIT</button>
            <button class="btn btn-danger" style="padding:4px 11px;font-size:.7rem" onclick="doDelete('${esc(p.id)}')">DEL</button>
          </div></td>
        </tr>`).join("");
    } catch(e) {
      toast("Auth failed: "+e.message,"err");
      _token = null;
      document.getElementById("auth-badge").style.display = "none";
      nav("admin-gate");
    }
  }

  // $state(form)
  async function openForm(id) {
    _editingId = id;
    document.getElementById("fmTitle").textContent   = id ? "// edit post" : "// new post";
    document.getElementById("fmId").value            = id || "";
    document.getElementById("fmTitleIn").value       = "";
    document.getElementById("fmSlugIn").value        = "";
    document.getElementById("fmContent").value       = "";
    document.getElementById("fmPub").checked         = false;
    if (id) {
      try {
        const posts = await api("GET","/api/admin/posts");
        const p = posts.find(x => x.id === id);
        if (p) {
          document.getElementById("fmTitleIn").value = p.title;
          document.getElementById("fmSlugIn").value  = p.slug;
          document.getElementById("fmContent").value = p.content;
          document.getElementById("fmPub").checked   = p.published;
        }
      } catch(e) { toast(e.message,"err"); return; }
    }
    nav("admin-form");
  }

  // $effect() — save
  async function doSave() {
    const title   = document.getElementById("fmTitleIn").value.trim();
    const slug    = document.getElementById("fmSlugIn").value.trim();
    const content = document.getElementById("fmContent").value.trim();
    const pub     = document.getElementById("fmPub").checked;
    if (!title||!content) { toast("Title and content required","err"); return; }
    try {
      if (_editingId) {
        await api("PUT","/api/admin/posts/"+_editingId,{title,slug,content,published:pub});
        toast("Post updated \u2713","ok");
      } else {
        await api("POST","/api/admin/posts",{title,slug,content,published:pub});
        toast("Post created \u2713","ok");
      }
      nav("admin");
    } catch(e) { toast("Save failed: "+e.message,"err"); }
  }

  // $effect() — delete
  async function doDelete(id) {
    if (!confirm("Delete this post?")) return;
    try {
      await api("DELETE","/api/admin/posts/"+id);
      toast("Deleted","ok");
      loadAdmin();
    } catch(e) { toast("Delete failed: "+e.message,"err"); }
  }

  // keyboard: slug auto-gen
  document.getElementById("fmTitleIn")?.addEventListener("input", e => {
    const sl = document.getElementById("fmSlugIn");
    if (!sl.dataset.m) sl.value = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g,"-");
  });
  document.getElementById("fmSlugIn")?.addEventListener("input", e => {
    e.target.dataset.m = e.target.value ? "1" : "";
  });
  document.getElementById("tInput")?.addEventListener("keydown", e => {
    if (e.key==="Enter") doLogin();
  });

  // expose to HTML onclick handlers
  window.nav       = nav;
  window.openPost  = openPost;
  window.doLogin   = doLogin;
  window.openForm  = openForm;
  window.doSave    = doSave;
  window.doDelete  = doDelete;

  nav("posts");
})();
</script>
</body>
</html>
