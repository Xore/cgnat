services:
  svelte-blog:
    image: node:22-alpine
    container_name: svelte-blog
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Project files, read-write: SvelteKit writes .svelte-kit/ during dev.
      - ./:/app
      # node_modules as a named volume so the native binaries (rollup/esbuild)
      # are built inside the alpine (musl) container, not copied from the host.
      - svelte-node-modules:/app/node_modules
    # List form keeps the whole script as one argument to `sh -c` (a folded
    # YAML scalar can inject a newline before && and break BusyBox sh).
    command:
      - sh
      - -c
      - "npm install && npm run dev -- --host 0.0.0.0 --port 4174"
    ports:
      - 127.0.0.1:4174:4174
    environment:
      # development (not production) so devDependencies — vite, @sveltejs/kit,
      # the adapter — actually install; the app has no runtime dependencies.
      - NODE_ENV=development
      - TZ=Europe/Berlin
      - ADMIN_PASSWORD=change-me-svelte
    # No `user: node`: the named volumes are created root-owned, so uid 1000
    # could not write node_modules/.svelte-kit. Nothing lands on the host.

  socat-svelte-blog:
    image: alpine/socat:latest
    container_name: socat-svelte-blog
    restart: unless-stopped
    command: TCP4-LISTEN:4174,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:4174
    network_mode: host
    depends_on:
      - svelte-blog

volumes:
  svelte-node-modules:
