# File Browser — web-based file manager
# Dockge: no extra files needed.
#
# Default credentials: admin / admin
# Change password immediately after first login!

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ./data:/srv                        # files to expose via the UI
      - filebrowser-db:/database
    ports:
      - 127.0.0.1:8070:80
    environment:
      - TZ=Europe/Berlin
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  socat-filebrowser:
    image: alpine/socat:latest
    container_name: socat-filebrowser
    restart: unless-stopped
    command: TCP4-LISTEN:8070,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:8070
    network_mode: host
    depends_on:
      - filebrowser

volumes:
  filebrowser-db:
