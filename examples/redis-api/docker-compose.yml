# Flask blog with Redis storage (xore//blog frontend + REST API)
# Dockge: place app.py, gunicorn.conf.py and the static/ folder
# in the stack folder (e.g. /opt/stacks/redis-api/)
#
# No Dockerfile needed.

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass changeme
    volumes:
      - redis-data:/data
    environment:
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a changeme --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  redis-api:
    image: python:3.12-slim
    container_name: redis-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./app.py:/app/app.py:ro
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
      - ./static:/app/static:ro
      - pip-cache:/root/.cache/pip
    # Use a list form so each argument is passed directly — no shell quoting issues
    command:
      - sh
      - -c
      - "pip install --quiet flask==3.0.3 gunicorn==23.0.0 redis==5.0.8 && gunicorn -c gunicorn.conf.py app:app"
    ports:
      - 127.0.0.1:5001:5001
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=changeme
      - ADMIN_PASSWORD=change-me-redis
      - TZ=Europe/Berlin
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # first start installs pip packages
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  socat-redis-api:
    image: alpine/socat:latest
    container_name: socat-redis-api
    restart: unless-stopped
    command: TCP4-LISTEN:5001,bind=10.8.0.2,fork,reuseaddr TCP4:127.0.0.1:5001
    network_mode: host
    depends_on:
      redis-api:
        condition: service_healthy

volumes:
  redis-data:
  pip-cache:
