version: 2
updates:
  # ── Go modules ───────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/vps/portbridge"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "automated"]

  # ── Docker ───────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/examples/cowrie-gpu"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "automated"]
  - package-ecosystem: "docker"
    directory: "/vps/portbridge"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "automated"]

  # ── GitHub Actions ───────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "automated"]
