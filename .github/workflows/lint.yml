name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
          additional_files: "vps/honeypot-firewall.sh"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find Dockerfiles
        id: find
        run: |
          {
            echo 'files<<EOF'
            find . -iname 'Dockerfile' -not -path './.git/*'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Hadolint
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint < "$f" || echo "::warning file=$f::hadolint findings above"
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.files }}"
